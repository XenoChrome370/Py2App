[package]
name = "packager"
version = "1.0.0"
edition = "2021"
description = "Package projects written in many languages into macOS apps and command-line tools"
publish = false

[[bin]]
name = "packager"
path = "src/main.rs"

[lib]
name = "packager"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
